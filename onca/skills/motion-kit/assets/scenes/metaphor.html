<div id="{{id}}-stage" class="om-stage">
  <div class="om-hero">
    <!-- art: your own inline SVG drawing of the line's picture (strokes, 3 to 12 of them); props: .om-prop pieces (labels, icons, stickers) placed around it -->
    <div id="{{id}}-art" class="om-s-art">{{art}}</div>
    <div id="{{id}}-props" class="om-s-props">{{props}}</div>
  </div>
</div>
